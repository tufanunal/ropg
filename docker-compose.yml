version: '3.8'

services:
  # Rogp Central Relay Server & Static Viewer Host
  rogp-relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    container_name: rogp-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ROGP_AUTH_TOKEN=${ROGP_AUTH_TOKEN:-rogp-secret-token}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/stats"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - rogp-net

  # Optional Cloudflare Tunnel service to expose Relay to app.dernekportal.com
  # (Only activates if TUNNEL_TOKEN environment variable is set in .env)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rogp-cloudflared
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - rogp-relay
    networks:
      - rogp-net
    profiles:
      - tunnel

networks:
  rogp-net:
    driver: bridge
